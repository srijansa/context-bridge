name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -Dmaven.repo.local=.m2/repository verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python gateway
        working-directory: ai-mcp-gateway-service
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check Python gateway
        working-directory: ai-mcp-gateway-service
        run: |
          python -m compileall app
          ruff check app
          pytest
          pip-audit

      - name: Scan containers
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
